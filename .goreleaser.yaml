version: 2
before:
  hooks:
    - go mod tidy
builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    wrap_in_directory: true
    files:
      - none*
    format_overrides:
      - goos: windows
        formats: [zip]
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
release:
  github:
    owner: guitmz
    name: capable
  name_template: "{{.Version}}"
checksum:
  name_template: "checksums.txt"
homebrew_casks:
  -
    name: capable
    repository:
      owner: guitmz
      name: homebrew-tools
    homepage: "https://github.com/guitmz/capable"
    description: "Interact with Capacities.io API from your terminal"
